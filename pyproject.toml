[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-lint"
version = "0.1.0"
description = "Static analysis and quality scoring for Claude Code SKILL.md files"
requires-python = ">=3.10"
dependencies = ["PyYAML"]

[project.scripts]
skill-lint = "skill_lint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
